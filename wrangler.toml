name = "byga-ai-multivote"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dashboard"


[[d1_databases]]
binding = "DB"
database_name = "byga-ai-multivote-db"
# IMPORTANT: this MUST be the ID of the NEW D1 database created with `npm run db:create`.
database_id = "2c9fc422-93ea-4d21-8c6a-3ec9fa2502ac"

# Primary market data source for POST /api/analyze — see
# src/market/chartDbProvider.js. READ-ONLY from this project: owned and
# ingested (every 5 min, Cloudflare Cron Trigger) by the separate
# `byga-chart` project (https://github.com/harvey-moeid/byga-chart).
# Nothing in this project writes to chart_db. If it's unreachable or stale,
# src/market/provider.js falls back to the live exchange chain below.
[[d1_databases]]
binding = "CHART_DB"
database_name = "chart_db"
database_id = "76f53f4c-a542-48a7-8eb8-10dbcba3c1aa"

# Two secrets are required for the login gate (functions/_middleware.js)
# and are NOT set here - secrets don't belong in wrangler.toml. Set them
# with `wrangler pages secret put APP_PASSWORD` / `... SESSION_SECRET`,
# or for local dev put them in a .dev.vars file (see .dev.vars.example
# and README "Login").
#   APP_PASSWORD    - the shared password required to sign in.
#   SESSION_SECRET  - random string used to sign session cookies.

[vars]
PRIMARY_EXCHANGE = "binance"
# One name or a comma-separated list tried in order after the primary
# (binance | bybit | okx), e.g. "bybit,okx".
FALLBACK_EXCHANGE = "bybit,okx"
SYMBOL = "BTCUSDT"
MARKET_TYPE = "perpetual"
TIMEFRAME = "5m"
# External AI provider model defaults. API keys are secrets; do NOT put them here.
# One model family per provider so the votes stay independent:
#   Gemini, OpenAI gpt-oss, Kimi K2, Mistral Large, Qwen3, Cohere Command,
#   Llama 3.3, DeepSeek V3.1, Grok.
GEMINI_MODEL = "gemini-2.5-flash"
GROQ_MODEL = "openai/gpt-oss-120b"
OPENROUTER_MODEL = "moonshotai/kimi-k2"
MISTRAL_MODEL = "mistral-large-latest"
HF_MODEL = "Qwen/Qwen3-235B-A22B-Instruct-2507:fastest"
COHERE_MODEL = "command-a-plus-05-2026"
NVIDIA_MODEL = "meta/llama-3.3-70b-instruct"
SAMBANOVA_MODEL = "DeepSeek-V3.1"
SAMBANOVA_BASE_URL = "https://api.sambanova.ai/v1/chat/completions"
AI_GATEWAY_MODEL = "xai/grok-4-fast-non-reasoning"
CANDLE_LIMIT = "150"
PROMPT_VERSION = "1.10.0"
MARKET_SCHEMA_VERSION = "1.3.0"
AI_TIMEOUT_MS = "60000"
MAX_RETRIES = "1"
HISTORY_RETENTION_DAYS = "365"
M15_HISTORY_DAYS = "4"
H1_HISTORY_DAYS = "30"
H4_HISTORY_DAYS = "180"
DAILY_HISTORY_DAYS = "365"
# Realized track record of past BUY/SELL votes (prompt block signal_track_record):
# - SIGNAL_HISTORY_DAYS: how far back to look for past analyses.
# - SIGNAL_OUTCOME_HORIZON_HOURS: how long after a vote its outcome is measured
#   (uses the D1-cached 1h candles; default 2h = middle of the 1-4h prompt horizon).
SIGNAL_HISTORY_DAYS = "365"
SIGNAL_OUTCOME_HORIZON_HOURS = "2"
# Run guards for POST /api/analyze (both compare against the last saved analysis):
# - ANALYZE_COOLDOWN_SECONDS: minimum seconds between runs. "0" disables.
# - ANALYZE_ONCE_PER_CANDLE: "1" refuses a 2nd run inside the same TIMEFRAME
#   candle (identical closed candles -> identical prompt -> wasted API quota).
#   "0" disables.
ANALYZE_COOLDOWN_SECONDS = "60"
ANALYZE_ONCE_PER_CANDLE = "1"
# Provider token budgets are set per adapter; model IDs can be changed above.
