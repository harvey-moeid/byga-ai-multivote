<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f8faf8" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="BYGA Office" />
<title>Login - AI Multi-Vote BTCUSDT Signal</title>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="login-screen">
    <form id="login-form" class="login-card">
      <img src="/byga-logo.png" alt="BYGA" width="72" height="72" style="display:block;width:72px;height:72px;object-fit:cover;border-radius:16px;margin:0 auto 18px;box-shadow:0 10px 30px rgba(0,92,255,.24)" />
      <h1>AI Multi-Vote BTCUSDT</h1>
      <p class="subtitle">Masukkan password untuk masuk.</p>
      <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Masuk</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </main>
  <script src="/login.js"></script>
  <script type="module" src="/pwa.js"></script>
</body>
</html>
