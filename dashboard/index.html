<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8faf8"><link rel="manifest" href="/manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="BYGA Office"><link rel="modulepreload" href="/office.bundle.js"><meta name="description" content="BYGA Trading Office — kantor trading 3D publik">
<title>BYGA Trading Office</title><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="stylesheet" href="/office.css">
</head>
<body class="office-app public-office">
<header class="office-header">
  <a href="/" class="office-brand" aria-label="BYGA Trading Office"><img class="brand-logo" src="/byga-logo.png" alt="" width="42" height="42"><span><b>BYGA <span>TRADING OFFICE</span></b><small>Kantor trading 3D · Public View</small></span></a>
  <div class="top-actions"><button id="install-app" class="office-icon install-app" type="button" title="Install aplikasi" aria-label="Install BYGA Trading Office" hidden>APP</button>
    <label class="quality-control"><span>Kualitas</span><select id="quality" aria-label="Kualitas grafis"><option value="auto">Otomatis</option><option value="low">Hemat · 50%</option><option value="medium">Seimbang · 75%</option><option value="high">Tinggi · 100%</option><option value="ultra">Ultra · GPU+</option></select></label>
    <a href="/admin" class="office-icon admin-link" title="Admin" aria-label="Masuk admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM5 21a7 7 0 0 1 14 0"/></svg></a>
  </div>
</header>
<main id="office-stage" aria-label="Kantor trading 3D publik">
  <div id="office-canvas"></div>
  <div id="scene-loading" class="scene-loading" role="status"><span class="loading-ring"></span><b>Membuka kantor…</b></div>
  <div id="scene-error" class="scene-error" hidden><h2>Kantor 3D tidak dapat ditampilkan</h2><p id="scene-error-message">WebGL tidak tersedia.</p><button id="scene-retry">Coba lagi</button></div>
  <div class="office-status"><span class="status-light"></span><div><b id="phase-title">Analis di meja kerja</b><span id="phase-subtitle">Kantor berjalan secara live</span></div></div>
  <aside class="public-market-hud" aria-live="polite">
    <span class="public-live-dot"></span>
    <div><small>MARKET</small><b id="public-symbol">BTCUSDT.P</b></div>
    <div><small>TIMEFRAME</small><b id="public-timeframe">H1 / M15 / M5</b></div>
    <div><small>HASIL</small><b id="public-signal">—</b></div>
    <div class="public-updated"><small>LAST UPDATE · WIB</small><b id="public-updated">Belum ada hasil</b></div>
  </aside>
  <div id="speech-layer" aria-live="polite"></div>
  <div class="view-controls" aria-label="Kontrol kamera">
    <button id="view-office" class="office-icon" title="Seluruh kantor" aria-label="Seluruh kantor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m3 9 9-6 9 6v12H3ZM9 21v-7h6v7"/></svg></button>
    <button id="view-meeting" class="office-icon" title="Ruang meeting" aria-label="Ruang meeting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="8" width="14" height="8" rx="2"/><path d="M8 3v3m8-3v3M8 18v3m8-3v3M2 11v2m20-2v2"/></svg></button>
    <button id="auto-camera" class="office-icon auto-camera" title="Kamera otomatis" aria-label="Kamera otomatis" aria-pressed="true">AUTO</button>
    <button id="zoom-in" class="office-icon" title="Perbesar" aria-label="Perbesar">+</button><button id="zoom-out" class="office-icon" title="Perkecil" aria-label="Perkecil">−</button><span id="render-info">AUTO</span>
  </div>
</main>
<script type="module" src="/public.js"></script><script type="module" src="/office.bundle.js"></script>
<script type="module" src="/pwa.js"></script>\n</body></html>
