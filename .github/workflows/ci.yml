name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build 3D office
        run: npm run build
      - name: Install browser for office verification
        run: npx playwright install --with-deps chromium
      - name: Verify 3D office on desktop and mobile
        run: npm run test:office
      - name: Upload office screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-screenshots
          path: /tmp/byga-office-qa
          if-no-files-found: ignore

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      - name: Ensure Cloudflare Pages project exists
        # Bundle Three.js locally so production does not depend on a CDN.
        run: npx wrangler pages project create byga-ai-multivote --production-branch=main || true

      # Semua migration dijalankan urut nama file.
      # Migration yang memakai ALTER TABLE dicek terhadap schema remote terlebih dulu
      # supaya deploy aman diulang walaupun migration pernah terpasang manual/parsial.
      # Ini hanya menyentuh byga-ai-multivote-db (storage aplikasi), BUKAN chart_db.
      - name: Run D1 migrations (remote)
        run: |
          for f in $(ls migrations/*.sql | sort); do
            echo "==> $f"
            if [ "$f" = "migrations/0006_four_vote_roles.sql" ]; then
              schema="$(npx wrangler d1 execute byga-ai-multivote-db --remote --command='PRAGMA table_info(analysis_results)' 2>/dev/null || true)"
              if echo "$schema" | grep -q "role" &&                  echo "$schema" | grep -q "vote_index" &&                  echo "$schema" | grep -q "vote_group" &&                  echo "$schema" | grep -q "data_source"; then
                echo "0006 already applied; skipping."
                continue
              fi
            fi
            if [ "$f" = "migrations/0007_analysis_decision_reason.sql" ]; then
              schema="$(npx wrangler d1 execute byga-ai-multivote-db --remote --command='PRAGMA table_info(analyses)' --json)"
              has_column="$(printf '%s' "$schema" | node -e 'const data=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!Array.isArray(data)||data.some(batch=>batch.success!==true||!Array.isArray(batch.results))) throw new Error("Invalid D1 schema response"); process.stdout.write(data.flatMap(batch=>batch.results).some(row=>row.name==="decision_reason")?"yes":"no");')"
              if [ "$has_column" = "yes" ]; then
                npx wrangler d1 execute byga-ai-multivote-db --remote --command='CREATE INDEX IF NOT EXISTS idx_analyses_decision_reason ON analyses (decision_reason)'
                echo "0007 already applied; skipping ALTER TABLE."
                continue
              fi
            fi
            if [ "$f" = "migrations/0009_directional_evidence.sql" ]; then
              schema="$(npx wrangler d1 execute byga-ai-multivote-db --remote --command='PRAGMA table_info(analysis_results)' --json)"
              has_column="$(printf '%s' "$schema" | node -e 'const data=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!Array.isArray(data)||data.some(batch=>batch.success!==true||!Array.isArray(batch.results))) throw new Error("Invalid D1 schema response"); process.stdout.write(data.flatMap(batch=>batch.results).some(row=>row.name==="evidence_json")?"yes":"no");')"
              if [ "$has_column" = "yes" ]; then
                echo "0009 already applied; skipping ALTER TABLE."
                continue
              fi
            fi
            npx wrangler d1 execute byga-ai-multivote-db --remote --file="$f"
          done

      - name: Validate GitHub login secrets
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          test -n "$APP_PASSWORD" || { echo "ERROR: GitHub Secret APP_PASSWORD kosong/tidak tersedia"; exit 1; }
          test -n "$SESSION_SECRET" || { echo "ERROR: GitHub Secret SESSION_SECRET kosong/tidak tersedia"; exit 1; }
          echo "GitHub login secrets tersedia."

      - name: Set Pages secrets (login)
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          printf '%s' "$APP_PASSWORD"   | npx wrangler pages secret put APP_PASSWORD   --project-name=byga-ai-multivote
          printf '%s' "$SESSION_SECRET" | npx wrangler pages secret put SESSION_SECRET --project-name=byga-ai-multivote

      - name: Deploy to Cloudflare Pages
        run: npm run build && npx wrangler pages deploy dashboard --project-name=byga-ai-multivote

      - name: Deploy five-minute scheduler
        run: npx wrangler deploy --config wrangler.scheduler.toml

      - name: Set scheduler signing secret
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --config wrangler.scheduler.toml

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          base="https://byga-ai.muidsoft.com"

          check_url() {
            local path="$1"
            local expect_json="${2:-0}"
            local body code attempt
            for attempt in {1..12}; do
              body="$(mktemp)"
              code="$(curl --silent --show-error --location --max-time 20 --output "$body" --write-out '%{http_code}' "$base$path" || true)"
              if [ "$code" = "200" ]; then
                if [ "$expect_json" = "1" ]; then
                  node -e '
                    const fs=require("fs");
                    const body=fs.readFileSync(process.argv[1],"utf8");
                    const data=JSON.parse(body);
                    if(data.symbol!=="BTCUSDT.P") throw new Error("Unexpected production symbol");
                  ' "$body"
                fi
                rm -f "$body"
                echo "Production smoke OK: $path"
                return 0
              fi
              echo "Production smoke attempt $attempt failed for $path (HTTP $code)"
              cat "$body" || true
              rm -f "$body"
              sleep 5
            done
            echo "ERROR: production endpoint failed after retries: $path"
            return 1
          }

          check_url "/" 0
          check_url "/api/public-status" 1
